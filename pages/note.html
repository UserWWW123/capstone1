<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Game Levels</title>
        <link rel="stylesheet" href="/css/styles.css">
        <script src="https://kit.fontawesome.com/44ae50a47e.js" crossorigin="anonymous"></script>
    </head>
<body>
    <div class="Note">
        <div id = "noteButtonContainer">
            <button class="notes__add">Add Note</button>
        </div>
        <div class="noteSection">
        <div class="notes__preview"></div>
        </div>
        <div class = "main-nav">
            <i class="fa-solid fa-bars" id = "menu-icon"></i>
            <div class = "nav-dropdown" id = "nav-menu">
                <a href = "/pages/index.html" >Home</a>
                <a class = "active"href = "/pages/note.html">Note</a>
                <a href = "/pages/levelsPage.html">Learn</a>
                <a href = "/pages/stage1.html">Game</a>
        </div>
        <script>
        if (window !== window.parent) {
            const nav = document.querySelector(".main-nav");
            if (nav) nav.style.display = "none";
        }
            document.getElementById("menu-icon").addEventListener("click", function(){
                document.getElementById("nav-menu").classList.toggle("show");
            });
            window.addEventListener("click", function(){
                if (!event.target.matches("#menu-icon")){
                    document.getElementById("nav-menu").classList.remove("show");
                }
            });
        </script>
</div>
    </div>
            <script src="/js/note.js"></script>
</body>
</html>
