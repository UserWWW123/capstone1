<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Levels</title>
    <link rel="stylesheet" href="/css/styles.css">

    <script src="https://kit.fontawesome.com/44ae50a47e.js" crossorigin="anonymous"></script>

</head>
<body id = levelsPageContainer>
     <div class="levelBox">
        <div class = "levelContainer">
            <div class = "levelTitles">
                <p id="level1Title">Level 1: Introduction of JavaScript</p>    
            </div>
            <p class = "levelReminder levelReminder1">Click images to explore lessons and games!</p>
            <i class="fa-solid fa-down-long levelReminderPointDown levelReminderPointDown1"></i>
                <div class = "level">
                <a href="/pages/lesson1.html">
                <button class="levelButtons">
                    <img class="levelImages levelDoor" src="/assets/doorClosed_N.png"></img>
                    <p class = "stageName">What is javascript (JS)?</p>
                </button>
                </a>
                <a href = "/pages/lesson1.html">
                <button class="levelButtons">
                    <img class="levelImages levelArrow" src="/assets/arrow_S.png"></img>
                    <p class = "stageName">What is HTML and CSS?</p>
                </button>
                </a>
                <a href = "/pages/lesson1.html">
                <button class="levelButtons">
                    <img class="levelImages levelDoor" src="/assets/doorClosed_N.png"></img>
                    <p class = "stageName">Summary:</p>
                </button>
                </a>
            </div>
                </div>
                <p class="levelReminder levelReminder2"> Scroll to right or click the arrow to see next level!</p>
                <i class="fa-solid fa-down-long levelReminderPointDown levelReminderPointDown2"></i>

                <button onclick = "goRight()" class = "levelMoveRight" class = "levelMoveRight1">
                    <i class="fa-solid fa-caret-right levelGoToRightArrow"></i>
                    <p>Go to Next Level!</p>
                </button>
                <script>
                    function goRight(){
                        let box = document.querySelector('.levelBox');
                        box.scrollBy({ left: 1100, behavior: "smooth"});
                    }
                </script>

        <div class = "levelContainer">
            <div class = "levelTitles">
                <p id="level1Title">Level 2: Variables</p>    
            </div>
                <div class = "level">
                    <a href="/pages/variables.html">
                    <button class="levelButtons">
                        <img class="levelImages levelDoor" src="/assets/doorClosed_N.png"></img>
                        <p class = "stageName">Variables Introduction</p>
                    </button>
                    </a>
                    <a href = "/pages/variables.html">
                    <button class="levelButtons">
                        <img class="levelImages levelArrow" src="/assets/arrow_S.png"></img>
                        <p class = "stageName">Create a variable & Add a value to the variable</p>
                    </button>
                    </a>
                    <a href = "/pages/variables.html">
                    <button class="levelButtons">
                        <img class="levelImages levelDoor" src="/assets/doorClosed_N.png"></img>
                        <p class = "stageName">Small Game</p>
                    </button>
                    </a>
                    <a href="/pages/stage1.html">
                        <button class="levelButtons">
                            <img class="levelImages levelArrow" src="/assets/arrow_S.png"></img>
                            <p class = "stageName">Variable Game</p>
                        </button>
                        </a>
                    </div>
           </div>

           <button onclick = "goRight()" class = "levelMoveRight" class = "levelMoveRight1">
            <i class="fa-solid fa-caret-right levelGoToRightArrow"></i>
            <p>Go to Next Level!</p>
        </button>
        <script>
            function goRight(){
                let box = document.querySelector('.levelBox');
                box.scrollBy({ left: 1100, behavior: "smooth"});
            }
        </script>

           <div class = "main-nav">
            <i class="fa-solid fa-bars" id = "menu-icon"></i>
            <div class = "nav-dropdown" id = "nav-menu">
                <a href = "/pages/index.html" >Home</a>
                <a href = "/pages/note.html">Note</a>
                <a class = "active" href = "/pages/levelsPage.html">Learn</a>
                <a href = "/pages/stage1.html">Game</a>
        </div>
        <script>
            document.getElementById("menu-icon").addEventListener("click", function(){
                document.getElementById("nav-menu").classList.toggle("show");
            });
            window.addEventListener("click", function(){
                if (!event.target.matches("#menu-icon")){
                    document.getElementById("nav-menu").classList.remove("show");
                }
            });
        </script>
</body>
</html>
